name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
          - name: Linux arm64
            runner: ubuntu-24.04-arm
          - name: macOS x64
            runner: macos-15-intel
          - name: macOS arm64
            runner: macos-15
          - name: Windows x64
            runner: windows-2025
          - name: Windows arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Use Node.js 24.14.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.1
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run tests
        run: npm test
      - name: Type-check
        run: npm run typecheck
      - name: Type-check WinGet source
        run: npm run typecheck:worker
      - name: Bundle WinGet source
        if: matrix.name == 'Linux x64'
        run: npm run build:winget-source
      - name: Build and smoke-test native CLI
        shell: bash
        run: bash scripts/build-cli.sh
      - name: Upload CLI package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Use Node.js 24.14.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.1
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check known vulnerabilities
        run: npm audit --audit-level=high
      - name: Verify registry signatures
        run: npm audit signatures

  winget-install:
    name: WinGet live install
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Add the explicit Mayphus source
        shell: pwsh
        run: >-
          winget source add
          --name mayphus
          --arg https://winget.mayphus.org/api/
          --type Microsoft.Rest
          --explicit
          --accept-source-agreements
          --disable-interactivity
      - name: Install and verify the released CLI
        shell: pwsh
        run: |
          winget install --id Mayphus.OpenCodeResponsesGateway --exact --source mayphus --accept-source-agreements --accept-package-agreements --disable-interactivity
          $executable = Join-Path $env:LOCALAPPDATA "Microsoft\WinGet\Links\opencode-gateway.exe"
          if (-not (Test-Path $executable)) { throw "WinGet did not create the portable command alias" }
          $expectedVersion = (Get-Content package.json | ConvertFrom-Json).version
          $actualVersion = (& $executable version).Trim()
          if ($actualVersion -ne $expectedVersion) { throw "Expected version $expectedVersion, got $actualVersion" }
      - name: Remove test installation and source
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          winget uninstall --id Mayphus.OpenCodeResponsesGateway --exact --source mayphus --disable-interactivity
          winget source remove --name mayphus --disable-interactivity
