name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
          - name: Linux arm64
            runner: ubuntu-24.04-arm
          - name: macOS x64
            runner: macos-15-intel
          - name: macOS arm64
            runner: macos-15
          - name: Windows x64
            runner: windows-2025
          - name: Windows arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Use Node.js 24.14.1
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.1
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run tests
        run: npm test
      - name: Type-check
        run: npm run typecheck
      - name: Verify tag matches package version
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"
      - name: Build and smoke-test native CLI
        shell: bash
        run: bash scripts/build-cli.sh
      - name: Attest release package
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
      - name: Upload release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ runner.os }}-${{ runner.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --generate-notes --verify-tag
