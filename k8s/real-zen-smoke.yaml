apiVersion: batch/v1
kind: Job
metadata:
  name: zen-direct-smoke
  namespace: opencode-responses-gateway
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: client
          image: node:24-alpine
          env:
            - name: OPENCODE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: opencode-credentials
                  key: OPENCODE_API_KEY
          command: ["node", "-e"]
          args:
            - |
              const response = await fetch('https://opencode.ai/zen/v1/chat/completions', {
                method: 'POST',
                headers: {
                  authorization: `Bearer ${process.env.OPENCODE_API_KEY}`,
                  'content-type': 'application/json',
                },
                body: JSON.stringify({
                  model: 'deepseek-v4-flash-free',
                  messages: [{ role: 'user', content: 'Reply with exactly: token-ok' }],
                  max_tokens: 64,
                }),
              });
              const body = await response.json();
              if (!response.ok) throw new Error(`Zen returned HTTP ${response.status}: ${body?.error?.message ?? 'unknown error'}`);
              const text = body?.choices?.[0]?.message?.content;
              if (typeof text !== 'string' || text.length === 0) throw new Error('Zen returned no assistant text');
              console.log(JSON.stringify({ directTokenTest: 'passed', model: body.model ?? 'deepseek-v4-flash-free', finishReason: body.choices[0].finish_reason, outputCharacters: text.length }));
