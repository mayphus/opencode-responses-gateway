apiVersion: batch/v1
kind: Job
metadata:
  name: zen-direct-inspect
  namespace: opencode-responses-gateway
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: client
          image: node:24-alpine
          env:
            - name: OPENCODE_API_KEY
              valueFrom:
                secretKeyRef: { name: opencode-credentials, key: OPENCODE_API_KEY }
          command: ["node", "-e"]
          args:
            - |
              const response = await fetch('https://opencode.ai/zen/v1/chat/completions', {
                method: 'POST',
                headers: { authorization: `Bearer ${process.env.OPENCODE_API_KEY}`, 'content-type': 'application/json' },
                body: JSON.stringify({ model: 'deepseek-v4-flash-free', messages: [{ role: 'user', content: 'Reply with exactly: token-ok' }], max_tokens: 64 }),
              });
              const body = await response.json();
              const choice = body?.choices?.[0] ?? {};
              const message = choice.message ?? {};
              console.log(JSON.stringify({
                httpStatus: response.status,
                topLevelKeys: Object.keys(body),
                choiceKeys: Object.keys(choice),
                messageKeys: Object.keys(message),
                finishReason: choice.finish_reason ?? null,
                contentType: typeof message.content,
                contentCharacters: typeof message.content === 'string' ? message.content.length : null,
                reasoningCharacters: typeof message.reasoning_content === 'string' ? message.reasoning_content.length : null,
                errorType: body?.error?.type ?? null,
              }));
              if (!response.ok) process.exit(1);
