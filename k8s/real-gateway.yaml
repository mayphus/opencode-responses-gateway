apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  namespace: opencode-responses-gateway
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: opencode-responses-gateway
spec:
  replicas: 1
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      serviceAccountName: gateway
      containers:
        - name: gateway
          image: node:24-alpine
          command: ["node", "--experimental-strip-types", "/app/src/server.ts"]
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - name: OPENCODE_CHAT_COMPLETIONS_URL
              value: https://opencode.ai/zen/v1/chat/completions
            - name: OPENCODE_API_KEY
              valueFrom:
                secretKeyRef: { name: opencode-credentials, key: OPENCODE_API_KEY }
          volumeMounts:
            - { name: source, mountPath: /app/src, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities: { drop: ["ALL"] }
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 1, periodSeconds: 2 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 500m, memory: 128Mi }
      volumes:
        - name: source
          configMap: { name: gateway-source }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: opencode-responses-gateway
spec:
  type: NodePort
  selector: { app: gateway }
  ports: [{ name: http, port: 8080, targetPort: http, nodePort: 32094 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: namespace-only-ingress
  namespace: opencode-responses-gateway
spec:
  podSelector:
    matchLabels:
      app: gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              access: gateway
    - from:
        - ipBlock:
            cidr: 192.168.36.0/24
      ports:
        - { protocol: TCP, port: 8080 }
